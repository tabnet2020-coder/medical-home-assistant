    <script>
      // Self-healing: if an old/stale Service Worker caused chunk loading errors, auto-unregister and clear caches
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || (e.target && e.target.src))) || '';
        if (
          typeof msg === 'string' &&
          (msg.indexOf('Failed to fetch') !== -1 ||
           msg.indexOf('dynamically imported module') !== -1 ||
           msg.indexOf('Loading chunk') !== -1)
        ) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              var unregisterPromises = registrations.map(function (reg) { return reg.unregister(); });
              Promise.all(unregisterPromises).then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (keys) {
                    Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                      window.location.reload();
                    });
                  });
                } else {
                  window.location.reload();
                }
              });
            });
          }
        }
      });
    </script>
