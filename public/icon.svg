<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald to Turquoise to Dark Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="75%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Medical Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Stethoscope Chrome/Teal Gradient -->
    <linearGradient id="stethoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Capsule Gradient -->
    <linearGradient id="capsuleGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="capsuleGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#34d399" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Background Squircle rx=115 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08" />
  <circle cx="256" cy="230" r="140" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.15" />

  <!-- 2. Main Medical Heart and Stethoscope Group -->
  <g filter="url(#softGlow)" transform="translate(0, -10)">
    
    <!-- Stylized Heart Base Ribbon (Left curve blending from leaf, right curve looping to stethoscope) -->
    <!-- Left Heart Arc with Leaf Integration -->
    <path d="M 256,165 C 242,120 185,100 145,130 C 105,160 100,220 140,270 C 175,315 225,350 256,375" 
          fill="none" 
          stroke="url(#heartGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Healing Natural Leaf on the Left Heart Branch -->
    <g transform="translate(112, 160) rotate(-35)">
      <!-- Leaf Body -->
      <path d="M 0,0 C -25,-20 -25,-60 15,-75 C 25,-40 20,-10 0,0 Z" fill="url(#leafGrad)" />
      <!-- Leaf Central Vein -->
      <path d="M 0,0 C 8,-25 10,-50 15,-75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none" />
      <path d="M 3,-25 Q 12,-30 15,-35" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" fill="none" />
      <path d="M 5,-45 Q 14,-50 17,-55" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5" fill="none" />
    </g>

    <!-- Secondary small leaf sprout -->
    <path d="M 125,215 C 105,210 90,195 95,178 C 112,180 122,198 125,215 Z" fill="#34d399" opacity="0.9" />

    <!-- Right Heart Arc smoothly morphing into Stethoscope Tubing -->
    <path d="M 256,165 C 270,120 327,100 367,130 C 407,160 412,220 372,270 C 342,310 295,348 256,375" 
          fill="none" 
          stroke="url(#stethoGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Stethoscope Head / Chest Piece (Floating seamlessly on the right side) -->
    <g transform="translate(385, 235)">
      <!-- Tubing loop connection -->
      <path d="M -15,15 C 10,25 25,10 22,-8 C 20,-20 8,-22 0,-15" fill="none" stroke="url(#stethoGrad)" stroke-width="10" stroke-linecap="round" />
      <!-- Outer Bell Ring -->
      <circle cx="20" cy="-6" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
      <circle cx="20" cy="-6" r="18" fill="url(#stethoGrad)" />
      <!-- Inner Diaphragm Core -->
      <circle cx="20" cy="-6" r="10" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Stethoscope Earpieces at top right edge -->
    <g transform="translate(330, 95)">
      <path d="M 0,25 C 10,5 28,-2 42,8" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" />
      <circle cx="43" cy="8" r="5.5" fill="#38bdf8" />
    </g>

    <!-- 3. Center Medical Capsule with Pulse Wave -->
    <g transform="translate(256, 235)">
      <!-- Soft back glow behind capsule -->
      <circle cx="0" cy="0" r="42" fill="#059669" opacity="0.35" filter="blur(10px)" />
      
      <!-- Angled Capsule / Pill -->
      <g transform="rotate(-30)">
        <!-- Top Half (White) -->
        <path d="M -16,-36 C -16,-48 -6,-56 6,-56 C 18,-56 28,-48 28,-36 L 28,-6 L -16,-6 Z" fill="url(#capsuleGradTop)" />
        <!-- Bottom Half (Emerald) -->
        <path d="M -16,-6 L 28,-6 L 28,24 C 28,36 18,44 6,44 C -6,44 -16,36 -16,24 Z" fill="url(#capsuleGradBottom)" />
        <!-- Separation Line -->
        <line x1="-16" y1="-6" x2="28" y2="-6" stroke="#047857" stroke-width="2" />
        <!-- Pill Shine -->
        <path d="M -10,-44 Q 6,-50 18,-42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
        <!-- Medical Cross on Capsule -->
        <rect x="2" y="-22" width="8" height="24" rx="2" fill="#059669" />
        <rect x="-6" y="-14" width="24" height="8" rx="2" fill="#059669" />
      </g>

      <!-- Dynamic ECG / Pulse Heartbeat Line overlapping center -->
      <path d="M -75,25 L -45,25 L -35,5 L -20,45 L -5,-5 L 8,30 L 22,25 L 75,25" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.95"
            filter="url(#innerGlow)" />
    </g>
  </g>

  <!-- 4. "Tabony" Signature in Elegant White Calligraphic Script at Bottom -->
  <g transform="translate(256, 432)" text-anchor="middle">
    <!-- Subtle drop glow behind text -->
    <text x="0" y="0" 
          font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', cursive, sans-serif" 
          font-size="44" 
          font-weight="bold" 
          font-style="italic" 
          letter-spacing="2"
          fill="#000000" 
          opacity="0.4"
          dx="1" dy="3">Tabony</text>
    
    <!-- Main Tabony Script Text -->
    <text x="0" y="0" 
          font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', cursive, sans-serif" 
          font-size="44" 
          font-weight="bold" 
          font-style="italic" 
          letter-spacing="2"
          fill="#ffffff">Tabony</text>

    <!-- Elegant flourish underline below Tabony -->
    <path d="M -55,14 Q 0,22 55,14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <circle cx="0" cy="18" r="2.5" fill="#a7f3d0" />
  </g>
</svg>
